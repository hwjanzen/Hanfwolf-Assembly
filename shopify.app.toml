# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "Hanfwolf-Assembly"
application_url = "https://hanfwolf-assembly-dwlt.onrender.com"
embedded = true
client_id = "f4e6ce06b814ce438e763a06be66307b"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_inventory,read_publications,write_publications,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_companies,read_customers,write_customers,write_draft_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://hanfwolf-assembly-dwlt.onrender.com/auth/callback", "https://hanfwolf-assembly-dwlt.onrender.com/auth/shopify/callback", "https://hanfwolf-assembly-dwlt.onrender.com/api/auth/callback" ]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

[app_proxy]
url = "https://hanfwolf-assembly-dwlt.onrender.com/apps/hanfwolf-pricing"
subpath = "hanfwolf-pricing"
prefix = "apps"

[metaobjects.app.configuration_position]
name = "Konfigurationsposition"
display_name_field = "label"
access.admin = "merchant_read_write"

[metaobjects.app.configuration_position.fields.code]
name = "Code"
type = "single_line_text_field"
required = true

[metaobjects.app.configuration_position.fields.label]
name = "Bezeichnung"
type = "single_line_text_field"
required = true

[metaobjects.app.configuration_position.fields.required]
name = "Pflichtauswahl"
type = "boolean"
required = true

[metaobjects.app.configuration_position.fields.sort_order]
name = "Sortierung"
type = "number_integer"
required = true

[metaobjects.app.configuration_position.fields.active]
name = "Aktiv"
type = "boolean"
required = true

[metaobjects.app.component_mapping]
name = "Konfigurationsfreigabe"
display_name_field = "label"
access.admin = "merchant_read_write"

[metaobjects.app.component_mapping.fields.label]
name = "Bezeichnung"
type = "single_line_text_field"
required = true

[metaobjects.app.component_mapping.fields.base_product]
name = "Basisartikel"
type = "product_reference"
required = true

[metaobjects.app.component_mapping.fields.position]
name = "Konfigurationsposition"
type = "metaobject_reference<$app:configuration_position>"
required = true

[metaobjects.app.component_mapping.fields.component]
name = "Komponentenvariante"
type = "variant_reference"
required = true

[metaobjects.app.component_mapping.fields.quantity]
name = "Komponentenmenge je Auswahl"
type = "number_integer"
required = true
validations.min = "1"

[metaobjects.app.component_mapping.fields.sort_order]
name = "Sortierung"
type = "number_integer"
required = true

[metaobjects.app.component_mapping.fields.active]
name = "Aktiv"
type = "boolean"
required = true

[product.metafields.app.configuration_positions]
name = "Konfigurationspositionen"
type = "list.metaobject_reference<$app:configuration_position>"
access.admin = "merchant_read_write"

[product.metafields.app.component_mappings]
name = "Zulaessige Komponenten"
type = "list.metaobject_reference<$app:component_mapping>"
access.admin = "merchant_read_write"
